<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporary responsive verification</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e8eb;font:14px system-ui}header{height:54px;display:flex;align-items:center;gap:14px;padding:8px 20px}input{width:490px}iframe{display:block;border:0;margin:0 20px;background:white;height:1200px}button,input,select{padding:6px}</style></head><body><header><label>Page <input id="path" value="/zh-cn/"></label><label>Width <select id="width"><option>390</option><option>768</option><option>1024</option><option>320</option></select></label><button id="load">Load</button></header><iframe title="Responsive website preview" id="preview"></iframe><script>const path=document.getElementById('path'),width=document.getElementById('width'),frame=document.getElementById('preview');const query=new URLSearchParams(location.search);path.value=query.get('page')||'/zh-cn/';width.value=query.get('width')||'390';function show(){frame.style.width=width.value+'px';const dest=new URL(path.value,location.origin);if(dest.origin===location.origin&&dest.pathname!=='/documentation/qa-responsive.html')frame.src=dest.href}document.getElementById('load').addEventListener('click',show);width.addEventListener('change',()=>frame.style.width=width.value+'px');show();</script></body></html>
