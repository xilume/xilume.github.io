name: Install 8Hub Why Visual

on:
  push:
    branches: [main]
    paths:
      - '.asset-staging/why8hub5.b64-*'
      - '.asset-staging/why8hub6.b64-*'
      - '.github/workflows/install-8hub-why-visual.yml'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Why 8Hub visual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          cat .asset-staging/why8hub5.b64-00 \
              .asset-staging/why8hub5.b64-01 \
              .asset-staging/why8hub6.b64-02 \
              .asset-staging/why8hub6.b64-03 \
              .asset-staging/why8hub6.b64-04 \
              .asset-staging/why8hub6.b64-05 > /tmp/why.b64
          base64 -d /tmp/why.b64 > images/8hub-embedded-why.webp
          echo '019360674675f4eb4c62344fde550d6839fa46e0abb85aa9dc9e1c34a5d69a09  images/8hub-embedded-why.webp' | sha256sum -c -

      - name: Replace old Why 8Hub cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('products/8hub-embedded/index.html')
          s = page.read_text(encoding='utf-8')
          start_marker = '    <section class="embedded-problems" id="why"'
          end_marker = '    <section class="embedded-drivers"'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = '''    <section class="embedded-problems embedded-problems-visual" id="why" aria-labelledby="embedded-why-title">
      <div class="embedded-wide embedded-why-wrap">
        <h2 class="sr-only" id="embedded-why-title">Why Xilume 8Hub Embedded?</h2>
        <figure class="embedded-why-figure">
          <img src="../../images/8hub-embedded-why.webp?v=20260818-6" alt="Why Xilume 8Hub Embedded: one internal board replaces scattered interface adapters, simplifies internal wiring, and combines two CAN FD with six serial interfaces.">
        </figure>
      </div>
    </section>'''
          s = s[:start] + replacement + '\n\n' + s[end:]
          s = re.sub(r'product\.css\?v=[^"\']+', 'product.css?v=20260818-6', s)
          page.write_text(s, encoding='utf-8')

          css = Path('products/8hub-embedded/product.css')
          c = css.read_text(encoding='utf-8')
          c += '''

/* Why 8Hub full visual v6 */
.embedded-problems-visual { padding:56px 0 88px; background:#f5f5f7; }
.embedded-problems-visual .embedded-why-wrap { width:min(1360px,calc(100% - 64px)); }
.embedded-why-figure { margin:0; overflow:hidden; border-radius:28px; background:#fff; box-shadow:0 24px 70px rgba(18,37,29,.07); }
.embedded-why-figure img { display:block; width:100%; height:auto; }
@media (max-width:900px) {
  .embedded-problems-visual { padding:36px 0 56px; }
  .embedded-problems-visual .embedded-why-wrap { width:calc(100% - 24px); }
  .embedded-why-figure { border-radius:18px; }
}
@media (max-width:640px) {
  .embedded-problems-visual { padding:22px 0 38px; }
  .embedded-why-figure { border-radius:12px; }
}
'''
          css.write_text(c, encoding='utf-8')
          PY

      - name: Commit finished website
        shell: bash
        run: |
          set -euo pipefail
          rm -f .asset-staging/why8hub*.b64-*
          rm -f .github/workflows/install-8hub-why-visual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Why 8Hub cards with full visual'
          git push
