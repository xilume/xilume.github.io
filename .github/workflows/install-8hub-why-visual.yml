name: Install 8Hub Why Visual

on:
  push:
    branches: [main]
    paths:
      - '.asset-staging/why8hub4.b64-*'
      - '.github/workflows/install-8hub-why-visual.yml'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct optimized Why 8Hub visual
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/why.b64
          for i in 00 01 02 03 04 05 06 07 08 09 10; do
            head -c 10000 ".asset-staging/why8hub4.b64-${i}" >> /tmp/why.b64
          done
          head -c 1028 .asset-staging/why8hub4.b64-11 >> /tmp/why.b64
          base64 -d /tmp/why.b64 > images/8hub-embedded-why.webp
          echo '3fbdb4357030ad54530328735115f50445e365284cc4c45d38ce1c2132d6f2fd  images/8hub-embedded-why.webp' | sha256sum -c -

      - name: Replace the Why 8Hub cards with the visual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('products/8hub-embedded/index.html')
          s = p.read_text(encoding='utf-8')
          replacement = '''    <section class="embedded-problems embedded-problems-visual" id="why" aria-labelledby="embedded-why-title">
              <div class="embedded-wide embedded-why-wrap">
                <h2 class="sr-only" id="embedded-why-title">Why Xilume 8Hub Embedded?</h2>
                <figure class="embedded-why-figure">
                  <img src="../../images/8hub-embedded-why.webp?v=20260818-1"
                       alt="Why Xilume 8Hub Embedded: one internal board replaces scattered interface adapters, simplifies internal wiring, and combines two CAN FD with six serial interfaces.">
                </figure>
              </div>
            </section>'''
          pattern = r'    <section class="embedded-problems" id="why".*?</section>\s*\n\s*<section class="embedded-drivers"'
          s, n = re.subn(pattern, replacement + '\n\n    <section class="embedded-drivers"', s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one Why section, got {n}')
          s = re.sub(r'product\.css\?v=[^"\']+', 'product.css?v=20260818-4', s)
          p.write_text(s, encoding='utf-8')
          PY

          cat >> products/8hub-embedded/product.css <<'CSS'

          /* Why 8Hub — full product visual */
          .embedded-problems-visual {
            padding: 64px 0 92px;
            background: #f5f5f7;
          }
          .embedded-problems-visual .embedded-why-wrap {
            width: min(1360px, calc(100% - 64px));
          }
          .embedded-why-figure {
            margin: 0;
            overflow: hidden;
            border: 1px solid rgba(16,24,20,.055);
            border-radius: 30px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(18,37,29,.07);
          }
          .embedded-why-figure img {
            display: block;
            width: 100%;
            height: auto;
          }
          @media (max-width: 900px) {
            .embedded-problems-visual { padding: 40px 0 60px; }
            .embedded-problems-visual .embedded-why-wrap { width: calc(100% - 24px); }
            .embedded-why-figure { border-radius: 20px; }
          }
          @media (max-width: 640px) {
            .embedded-problems-visual { padding: 24px 0 42px; }
            .embedded-why-figure { border-radius: 14px; }
          }
          CSS

      - name: Commit finished website and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .asset-staging/why8hub*.b64-*
          rm -f .github/workflows/install-8hub-why-visual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Why 8Hub cards with product visual'
          git push
