name: Build 8Hub Embedded assets

on:
  push:
    branches: [main]
    paths:
      - '.asset-staging/**'
      - '.github/workflows/build-8hub-embedded-assets.yml'

permissions:
  contents: write

jobs:
  build-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct optimized product images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          cat .asset-staging/hero.bin-* > images/8hub-embedded-hero.webp
          cat .asset-staging/top.bin-* > images/8hub-embedded-top.webp
          cat .asset-staging/terminal.bin-* > images/8hub-embedded-terminal.webp
          echo 'd63c9eb91081731853201e094e2782eca037fd75825edf77099d6a42ee76cea8  images/8hub-embedded-hero.webp' | sha256sum -c -
          echo '1cd2dd30e2d0c3db461ce45f2da220662c35cb03fec2f0a6f9d3023bbbdbaadb  images/8hub-embedded-top.webp' | sha256sum -c -
          echo 'a351de1e3a720868cff4c121622042f1a2e7ee8abda736d93913978e0ff38487  images/8hub-embedded-terminal.webp' | sha256sum -c -

      - name: Commit website assets and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-staging
          rm -f .github/workflows/build-8hub-embedded-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add optimized 8Hub Embedded product images'
          git push
