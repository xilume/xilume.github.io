name: Apply Xilume website release

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release files
        run: |
          cat xilume-release-piece-* > /tmp/xilume-site-release.tar.gz
          mkdir -p /tmp/xilume-site-release
          tar -xzf /tmp/xilume-site-release.tar.gz -C /tmp/xilume-site-release
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/xilume-site-release/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish software and driver download center"
            git push origin HEAD:main
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css zh-cn.css finder.js chip-selector.js hero.js site.js favicon.svg favicon.ico xilume-icon-96.png xilume-icon-180.png xilume-icon-192.png xilume-icon-512.png site.webmanifest brand-mark-48.png brand-mark-96.png brand-mark-180.png brand-mark-192.png brand-mark-512.png .nojekyll CNAME robots.txt sitemap.xml google9b5d5cd94eca340c.html _site/
          cp -R products images media contact about documentation downloads chip-selector applications solutions zh-cn _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
