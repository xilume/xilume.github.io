name: Deploy Xilume website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css finder.js chip-selector.js hero.js site.js favicon.svg favicon.ico site.webmanifest brand-mark-48.png brand-mark-96.png brand-mark-180.png brand-mark-192.png brand-mark-512.png .nojekyll CNAME robots.txt sitemap.xml google9b5d5cd94eca340c.html _site/
          cp -R products images contact about documentation chip-selector applications _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
