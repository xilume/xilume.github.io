name: Deploy Xilume website

on:
  push:
    branches: [main]
    paths-ignore:
      - AGENTS.md
      - README.md
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: site-check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test maintenance tools
        run: python scripts/test-site-tools.py
      - name: Test language navigation
        run: node scripts/test-language-navigation.cjs
      - name: Prepare static site
        run: python scripts/build-site.py
      - name: Verify publication files, links and SEO
        run: python scripts/check-site.py _site
      - name: Check JavaScript syntax
        run: find _site -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
