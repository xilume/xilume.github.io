name: Check Xilume website

on:
  push:
    branches: [main]
    paths-ignore:
      - AGENTS.md
      - README.md
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: site-check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test maintenance tools
        run: python scripts/test-site-tools.py
      - name: Test language navigation
        run: node scripts/test-language-navigation.cjs
      - name: Test contact form
        run: node scripts/test-contact-form.cjs
      - name: Test shop purchase states
        run: node scripts/test-shop.cjs
      - name: Prepare static site
        run: python scripts/build-site.py
      - name: Verify publication files, links and SEO
        run: python scripts/check-site.py _site
      - name: Check JavaScript syntax
        run: find _site -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
