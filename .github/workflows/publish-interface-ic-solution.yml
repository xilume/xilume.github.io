name: Publish interface IC integration solution

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6a29fdeb7f78ebab6337499c6d9878e4284ea3f6"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/publish-interface-ic-solution.yml"

      - name: Apply verified release
        shell: bash
        run: |
          set -euo pipefail
          base64 -d > /tmp/xilume-chip-solution.patch.gz <<'XILUME_RELEASE'
          
          XILUME_RELEASE
          echo "424ff18504ec9317ce9e6dfe439e7d9cb3ad777a96b9ec87ffabadced610d651  /tmp/xilume-chip-solution.patch.gz" | sha256sum -c -
          gzip -dc /tmp/xilume-chip-solution.patch.gz > /tmp/xilume-chip-solution.patch
          echo "cec779aec8ec25390e7d62dca59696e62ce452e9cc5a239b52eadfe890be06e9  /tmp/xilume-chip-solution.patch" | sha256sum -c -
          git apply --check /tmp/xilume-chip-solution.patch
          git apply /tmp/xilume-chip-solution.patch
          rm .github/workflows/publish-interface-ic-solution.yml
          echo "923c43f039754e2d4158ff1e42f392a7da13238ec0bfd31e7d0655cedf36cca8  site.js" | sha256sum -c -
          echo "e6f9e5cd1707fd95281fe78d8db4b23564794f8aa79d7059f27c06acd6ef6391  solutions/index.html" | sha256sum -c -
          echo "08f8bff92a871a82e893f6263bf6407d44aff3f4fdfa540cfc83506ee6f0e1bd  solutions/solutions.css" | sha256sum -c -
          echo "053fdf0417191ded54401a8ac27a87699ccb870116a94404f01a62104ebf6f07  zh-cn/solutions/index.html" | sha256sum -c -
          actual="$(git status --porcelain | cut -c4- | sort)"
          expected="$(printf '%s\n' '.github/workflows/publish-interface-ic-solution.yml' 'site.js' 'solutions/index.html' 'solutions/solutions.css' 'zh-cn/solutions/index.html' | sort)"
          test "$actual" = "$expected"

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add interface IC integration solution"
          git push origin HEAD:main
