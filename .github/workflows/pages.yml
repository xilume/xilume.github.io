name: Deploy Xilume website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css finder.js chip-selector.js hero.js site.js favicon.svg favicon.ico xilume-icon-96.png xilume-icon-180.png xilume-icon-192.png xilume-icon-512.png site.webmanifest brand-mark-48.png brand-mark-96.png brand-mark-180.png brand-mark-192.png brand-mark-512.png .nojekyll CNAME robots.txt sitemap.xml google9b5d5cd94eca340c.html _site/
          cp -R products images contact about documentation chip-selector applications _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const runId = context.runId
            const buildVersion = context.sha
            const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds))

            const { data: artifactResponse } = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts',
              { owner, repo, run_id: runId, per_page: 100 }
            )
            const artifacts = artifactResponse.artifacts.filter(
              artifact => artifact.name === 'github-pages' && !artifact.expired
            )
            if (artifacts.length !== 1) {
              throw new Error(`Expected one github-pages artifact, found ${artifacts.length}.`)
            }

            const idToken = await core.getIDToken()
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                owner,
                repo,
                artifact_id: artifacts[0].id,
                pages_build_version: buildVersion,
                oidc_token: idToken
              }
            )
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || buildVersion
            core.setOutput('page_url', deployment.page_url || '')
            core.info(`Created Pages deployment ${deploymentId}.`)

            const finalErrors = new Set([
              'deployment_failed',
              'deployment_perms_error',
              'deployment_content_failed',
              'deployment_cancelled',
              'deployment_lost'
            ])
            const startedAt = Date.now()
            const maxWait = 25 * 60 * 1000

            while (Date.now() - startedAt < maxWait) {
              await sleep(10000)
              const { data: current } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                { owner, repo, deployment_id: deploymentId }
              )
              core.info(`Current status: ${current.status}`)
              if (current.status === 'succeed') {
                core.info('Reported success!')
                return
              }
              if (finalErrors.has(current.status)) {
                throw new Error(`Pages deployment ended with status: ${current.status}`)
              }
            }

            await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
              { owner, repo, deployment_id: deploymentId }
            )
            throw new Error('Pages deployment remained queued for 25 minutes and was cancelled.')
