<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Xilume Octant connection architecture</title>
  <desc id="desc">One USB host connects through Xilume Octant to two CAN FD, four RS-485, and two RS-232 channels.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7ca7c8" stroke-opacity=".10"/>
    </pattern>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12324d"/>
      <stop offset="1" stop-color="#07131e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#050b12"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <circle cx="608" cy="350" r="305" fill="#087ed8" opacity=".08"/>

  <g font-family="Arial,Helvetica,sans-serif">
    <text x="62" y="62" fill="#75baff" font-size="13" font-weight="700" letter-spacing="3">ONE HOST · EIGHT FIELD CHANNELS</text>

    <rect x="72" y="268" width="230" height="184" rx="12" fill="#0d1b28" stroke="#28445a" stroke-width="2"/>
    <rect x="114" y="306" width="146" height="78" rx="6" fill="#132a3d" stroke="#3b6687"/>
    <rect x="146" y="324" width="82" height="43" rx="3" fill="#08121c" stroke="#79b7e6"/>
    <text x="187" y="351" fill="#e8f3fb" font-size="16" font-weight="700" text-anchor="middle">HOST</text>
    <text x="187" y="414" fill="#7f96a9" font-size="13" text-anchor="middle">PC · IPC · EMBEDDED SYSTEM</text>

    <path d="M302 360H416" stroke="#168ff1" stroke-width="5"/>
    <circle cx="357" cy="360" r="7" fill="#7bc5ff" filter="url(#glow)"/>
    <text x="359" y="340" fill="#76a6c9" font-size="12" font-weight="700" text-anchor="middle">USB</text>

    <rect x="416" y="156" width="358" height="408" rx="18" fill="url(#hub)" stroke="#2474ad" stroke-width="2"/>
    <rect x="451" y="196" width="288" height="138" rx="9" fill="#07101a" stroke="#284b67"/>
    <text x="595" y="253" fill="#f3f8fc" font-size="32" font-weight="700" text-anchor="middle">Xilume Octant</text>
    <text x="595" y="287" fill="#62b5f2" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">MULTI-INTERFACE HUB</text>
    <g fill="#0a1722" stroke="#335c78">
      <rect x="461" y="374" width="71" height="60" rx="6"/><rect x="541" y="374" width="71" height="60" rx="6"/><rect x="621" y="374" width="71" height="60" rx="6"/><rect x="701" y="374" width="28" height="60" rx="6"/>
      <rect x="461" y="448" width="71" height="60" rx="6"/><rect x="541" y="448" width="71" height="60" rx="6"/><rect x="621" y="448" width="71" height="60" rx="6"/><rect x="701" y="448" width="28" height="60" rx="6"/>
    </g>
    <text x="595" y="539" fill="#7892a5" font-size="11" text-anchor="middle">CHANNEL MAP · HOST INTERFACE</text>

    <path d="M774 228H875" stroke="#168ff1" stroke-width="4"/>
    <path d="M774 360H875" stroke="#24b6ae" stroke-width="4"/>
    <path d="M774 492H875" stroke="#8a9cac" stroke-width="4"/>
    <circle cx="830" cy="228" r="6" fill="#72c6ff" filter="url(#glow)"/>
    <circle cx="830" cy="360" r="6" fill="#55d9cd" filter="url(#glow)"/>
    <circle cx="830" cy="492" r="6" fill="#c3d1dc"/>

    <rect x="875" y="160" width="252" height="134" rx="12" fill="#0b1925" stroke="#1d75b1" stroke-width="2"/>
    <text x="913" y="211" fill="#70c5ff" font-size="31" font-weight="700">2×</text>
    <text x="979" y="211" fill="#eaf5fc" font-size="20" font-weight="700">CAN FD</text>
    <text x="913" y="246" fill="#8298a9" font-size="13">Independent field networks</text>

    <rect x="875" y="313" width="252" height="134" rx="12" fill="#0b1925" stroke="#238e8a" stroke-width="2"/>
    <text x="913" y="364" fill="#55d9cd" font-size="31" font-weight="700">4×</text>
    <text x="979" y="364" fill="#eaf5fc" font-size="20" font-weight="700">RS-485</text>
    <text x="913" y="399" fill="#8298a9" font-size="13">Industrial serial devices</text>

    <rect x="875" y="466" width="252" height="134" rx="12" fill="#0b1925" stroke="#566b7b" stroke-width="2"/>
    <text x="913" y="517" fill="#c6d5df" font-size="31" font-weight="700">2×</text>
    <text x="979" y="517" fill="#eaf5fc" font-size="20" font-weight="700">RS-232</text>
    <text x="913" y="552" fill="#8298a9" font-size="13">Service and legacy equipment</text>

    <text x="600" y="676" fill="#5f7688" font-size="12" text-anchor="middle" letter-spacing="2">XILUME OCTANT · DESKTOP COMMUNICATION INTERFACE</text>
  </g>
</svg>
