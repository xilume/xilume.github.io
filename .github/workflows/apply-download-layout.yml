name: Apply compact download layout

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  apply-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply website files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import io
          import tarfile
          from pathlib import Path

          payload = ""
          archive = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise RuntimeError(f"Unsafe path: {member.name}")
              bundle.extractall(".", members=members)
          PY

      - name: Record website update
        shell: bash
        run: |
          rm -f .github/workflows/apply-download-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/downloads.css downloads/index.html zh-cn/downloads/index.html products/mini-pcie-dual-can-fd/index.html products/8hub/index.html products/8hub-embedded/index.html zh-cn/products/mini-pcie-dual-can-fd/index.html zh-cn/products/8hub/index.html zh-cn/products/8hub-embedded/index.html .github/workflows/apply-download-layout.yml
          if ! git diff --cached --quiet; then
            git commit -m "Simplify software and driver downloads"
            git push origin HEAD:main
          fi

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css zh-cn.css finder.js chip-selector.js hero.js site.js favicon.svg favicon.ico xilume-icon-96.png xilume-icon-180.png xilume-icon-192.png xilume-icon-512.png site.webmanifest brand-mark-48.png brand-mark-96.png brand-mark-180.png brand-mark-192.png brand-mark-512.png .nojekyll CNAME robots.txt sitemap.xml google9b5d5cd94eca340c.html _site/
          cp -R products images media contact about documentation downloads chip-selector applications solutions zh-cn _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

